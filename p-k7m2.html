<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Acesso</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1916;
      --muted: #6b645c;
      --card: #fffdf8;
      --line: #e4ddd3;
      --d: #c23b2e;
      --accent: #1c1916;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: #171411;
      color: #f4f1ea;
      padding: 18px 24px;
    }
    header strong { letter-spacing: 0.08em; font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.03em; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    input {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      margin-left: 8px;
    }
    .hint { font-size: 13px; color: var(--muted); }
    .err { color: var(--d); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .gate { max-width: 420px; }
    .bars { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 28px 1fr 48px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
    .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; }
    .bg-d { background: #c23b2e; } .bg-i { background: #d4a017; }
    .bg-s { background: #2f7d4a; } .bg-c { background: #2a5f9e; }
    .rec { font-size: 22px; margin: 0; }
    tr.pick { cursor: pointer; }
    tr.pick:hover td { background: #f4f1ea; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><strong>DISC-IMOC</strong></header>
  <main id="app"></main>
  <script src="score.js"></script>
  <script src="crypto.js?v=2"></script>
  <script>
    const SESSION_KEY = "disc-imoc-sess"
    const SESSION_MS = 60 * 60 * 1000
    let priv = null
    let openId = ""

    function el(html) { document.getElementById("app").innerHTML = html }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
    }
    function short(s) { return (s || "").replace("Gestão de ", "").replace("Performance / ", "") }
    function bar(k, name, n) {
      return `<div class="bar-row"><b>${k}</b><div><div class="hint">${name}</div><div class="bar"><i class="bg-${k.toLowerCase()}" style="width:${n}%"></i></div></div><b>${n}%</b></div>`
    }
    function saveSession(jwk) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ exp: Date.now() + SESSION_MS, priv: jwk }))
    }
    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null")
        if (!s || Date.now() > s.exp || !s.priv) {
          localStorage.removeItem(SESSION_KEY)
          return null
        }
        return s.priv
      } catch {
        return null
      }
    }

    function loginView(err) {
      el(`
        <div class="card gate">
          <h1>Acesso restrito</h1>
          <p class="lede">Somente gestão.</p>
          <label>Senha</label>
          <input id="pw" type="password" autocomplete="current-password" />
          <p class="err">${esc(err || "")}</p>
          <button id="go">Entrar</button>
        </div>
      `)
      document.getElementById("pw").focus()
      document.getElementById("go").onclick = tryUnlock
      document.getElementById("pw").onkeydown = (e) => { if (e.key === "Enter") tryUnlock() }
    }

    async function tryUnlock() {
      const password = document.getElementById("pw").value
      try {
        priv = await ImocCrypto.unlockPrivate(password)
        saveSession(priv)
        await panelView()
      } catch {
        loginView("Senha incorreta.")
      }
    }

    async function loadCiphers() {
      const r = await fetch("data/submissions.json?" + Date.now(), { cache: "no-store" })
      if (!r.ok) throw new Error("fetch")
      return r.json()
    }

    async function panelView() {
      el(`<h1>Equipe</h1><p class="hint">Carregando…</p>`)
      let rows = []
      try {
        const ciphers = await loadCiphers()
        for (const c of ciphers) {
          try { rows.push(await ImocCrypto.decryptRow(priv, c)) } catch {}
        }
      } catch {
        el(`<div class="card"><p class="err">Não foi possível carregar as respostas.</p><button id="retry">Tentar de novo</button></div>`)
        document.getElementById("retry").onclick = panelView
        return
      }
      const roles = DiscImoc.ROLES
      const sorted = rows.sort((a, b) => a.person.nome.localeCompare(b.person.nome, "pt"))
      el(`
        <h1>Equipe</h1>
        <p class="lede">${sorted.length} resposta(s).</p>
        <div class="card" style="overflow-x:auto">
          ${sorted.length ? `<table>
            <thead>
              <tr>
                <th>Operador</th><th>Atual</th>
                ${roles.map((r) => `<th class="num">${esc((r.name.split("–")[0] || r.name).trim())}</th>`).join("")}
                <th>Recomendado</th>
              </tr>
            </thead>
            <tbody>
              ${sorted.map((row) => {
                const map = Object.fromEntries((row.roles || []).map((r) => [r.id, r.score]))
                return `<tr class="pick" data-id="${esc(row.person.id)}">
                  <td><b>${esc(row.person.nome)}</b><div class="hint">${esc(row.person.id)} · ${esc(row.person.turno)}</div></td>
                  <td>${esc(short(row.person.funcao))}</td>
                  ${roles.map((r) => `<td class="num">${map[r.id] ?? "–"}%</td>`).join("")}
                  <td>${esc(short(row.recommended))}</td>
                </tr>`
              }).join("")}
            </tbody>
          </table>` : `<p class="hint">Nenhuma resposta ainda.</p>`}
        </div>
        <button class="ghost" id="reload">Atualizar</button>
        ${detailHtml(sorted.find((r) => r.person.id === openId))}
      `)
      document.getElementById("reload").onclick = panelView
      document.querySelectorAll("tr.pick").forEach((tr) => {
        tr.onclick = () => {
          openId = tr.dataset.id
          panelView()
        }
      })
    }

    function detailHtml(row) {
      if (!row) return ""
      const p = row.pct || {}
      return `
        <div class="card">
          <h2 style="margin-top:0">${esc(row.person.nome)}</h2>
          <p class="lede">Perfil: <b>${esc(row.profile)}</b> · ${esc(row.person.funcao)}</p>
          <div class="bars" style="margin:12px 0 18px">
            ${bar("D", "Dominância", p.D)}
            ${bar("I", "Influência", p.I)}
            ${bar("S", "Estabilidade", p.S)}
            ${bar("C", "Conformidade", p.C)}
          </div>
          <p class="hint">Função recomendada</p>
          <p class="rec">${esc(row.recommended)} — ${row.roles?.[0]?.score ?? ""}%</p>
        </div>
        <div class="card">
          <h2 style="margin-top:0">Aderência</h2>
          <table>
            <tbody>
              ${(row.roles || []).map((r) => `<tr><td>${esc(r.name)}</td><td class="num">${r.score}%</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="row">
          <div class="card">
            <h2 style="margin-top:0">Pontos fortes</h2>
            <ul>${(row.strengths || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
          </div>
          <div class="card">
            <h2 style="margin-top:0">Pontos de atenção</h2>
            <ul>${(row.watchouts || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
          </div>
        </div>`
    }

    priv = loadSession()
    if (priv) panelView()
    else loginView()
  </script>
</body>
</html>
