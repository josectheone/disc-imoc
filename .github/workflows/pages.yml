name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [ingest]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: |
          mkdir -p site/data site/n2
          cp index.html p-k7m2.html score.js site/
          cp n2/index.html n2/p-w8n2.html site/n2/
          cp data/submissions.json data/submissions-n2.json site/data/
          node -e 'const fs=require("fs"); const t=process.env.DISC_WRITE||""; if(!t) throw new Error("missing DISC_WRITE"); const s=fs.readFileSync("crypto.js","utf8").replace("const WRITE_TOKEN = \"\"", "const WRITE_TOKEN = "+JSON.stringify(t)); fs.writeFileSync("site/crypto.js", s)'
        env:
          DISC_WRITE: ${{ secrets.DISC_WRITE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
