name: ingest
on:
  repository_dispatch:
    types: [disc-submit, disc-submit-n2]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    env:
      FILE: ${{ github.event.action == 'disc-submit-n2' && 'data/submissions-n2.json' || 'data/submissions.json' }}
    steps:
      - uses: actions/checkout@v4
      - run: node ingest.js
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
      - run: |
          git config user.name disc-imoc
          git config user.email 42573751+josectheone@users.noreply.github.com
          git add "$FILE"
          git diff --staged --quiet || git commit -m "disc"
          git push
